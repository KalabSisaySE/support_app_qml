name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint and test
        run: |
          python -m ruff check .
          python -m pytest

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          python -c "import os; from support_app.version import __version__; tag = os.environ['GITHUB_REF_NAME']; assert tag == f'v{__version__}', f'Tag {tag} does not match v{__version__}'"

      - name: Build application
        run: python build_project.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" output\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacrosoftSupportInstaller
          path: output/installer_file/MacrosoftSupportInstaller.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/installer_file/MacrosoftSupportInstaller.exe
          generate_release_notes: true
