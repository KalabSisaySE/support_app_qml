[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "macrosoft-support"
dynamic = ["version"]
description = "Macrosoft Support desktop application (PySide6/QML)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6==6.8.2.1",
    "psutil==7.0.0",
    "pywin32==310; sys_platform == 'win32'",
    "requests==2.32.3",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.15.0",
    "pyinstaller-hooks-contrib==2025.8",
]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.9",
    "pyright>=1.1",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["support_app*"]

[tool.setuptools.dynamic]
version = {attr = "support_app.version.__version__"}

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv", "build", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = [
    "support_app/app_config.py",
    "support_app/settings.py",
    "support_app/api.py",
    "support_app/diagnostics.py",
    "support_app/logging_setup.py",
    "support_app/installer_verification.py",
    "support_app/preflight.py",
    "support_app/progress.py",
    "support_app/qt_bindings.py",
    "support_app/status.py",
    "support_app/tasks.py",
    "support_app/upload_queue.py",
    "support_app/version.py",
]
pythonVersion = "3.13"
typeCheckingMode = "basic"
